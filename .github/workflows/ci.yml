name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "Python ${{ matrix.python-version }} · ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Doctests
        run: python -m doctest another_note.py

      - name: Unit tests (50-case stdlib suite)
        run: python -m unittest test_another_note -v

      - name: CLI self-check (synthetic, offline)
        run: python another_note.py selfcheck

      - name: CLI classify smoke (offline, bundled data)
        run: python another_note.py classify facebook.com/example_page_one

      - name: Verify packaging bits
        shell: bash
        run: |
          test -x another_note.py || chmod +x another_note.py
          test -f data/transgender_friendly.dat
          test -f data/transgender_averse.dat
