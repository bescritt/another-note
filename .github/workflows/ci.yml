name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Doctests
        run: python3 -m doctest another_note.py
      - name: Unittest suite
        run: python3 -m unittest test_another_note
      - name: Self-check (FNV-1a + bloom math)
        run: python3 another_note.py selfcheck
      - name: Offline smoke classify
        run: python3 another_note.py classify facebook.com/example_page_one
